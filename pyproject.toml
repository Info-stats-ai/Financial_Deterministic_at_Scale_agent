[project]
name = "interface-ai-record-replay"
version = "0.1.0"
description = "LLM-discovered, deterministic computer-use capabilities"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "anthropic>=0.75.0",
  "fastapi>=0.119.0",
  "jinja2>=3.1.6",
  "playwright>=1.55.0",
  "pydantic>=2.12.0",
  "pydantic-settings>=2.11.0",
  "python-dotenv>=1.1.1",
  "pyyaml>=6.0.3",
  "typer>=0.19.2",
  "uvicorn>=0.37.0",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.18.2",
  "pytest>=8.4.2",
  "pytest-asyncio>=1.2.0",
  "ruff>=0.14.0",
  "types-pyyaml>=6.0.12.20250915",
]

[project.scripts]
capability = "interface_ai.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/interface_ai"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
